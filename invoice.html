<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Invoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="assets/js/config.js?v=1792145528736"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #111;
            margin: 0;
            padding: 24px 16px 48px;
            background: #f1f5f9;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .print-toolbar {
            max-width: 820px;
            margin: 0 auto 16px;
            background: #0f172a;
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .toolbar-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar-btn.secondary {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.22);
        }
        .invoice-box {
            max-width: 800px;
            margin: 0 auto 28px;
            border: 1px solid #e2e8f0;
            padding: 36px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .page-break {
            page-break-before: always;
            break-before: page;
        }
        .parcel-type-banner {
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
        }
        .parcel-type-banner.master {
            background: #0f172a;
            color: #fff;
            border: 2px solid #0f172a;
        }
        .parcel-type-banner.brand-sub {
            background: #f3e8ff;
            color: #581c87;
            border: 2px dashed #9333ea;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #0f172a;
            padding-bottom: 18px;
            margin-bottom: 22px;
            gap: 16px;
        }
        .store-info h1 { margin: 0; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; color: #0f172a; }
        .store-info p { margin: 3px 0 0; font-size: 12px; color: #475569; }
        .invoice-title { text-align: right; }
        .invoice-title h2 { margin: 0; font-size: 22px; color: #0f172a; font-weight: 900; letter-spacing: 0.5px; }
        .invoice-title p { margin: 4px 0 0; font-size: 12.5px; font-weight: 700; color: #475569; }
        .details-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            margin-bottom: 22px;
        }
        .details-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 16px;
        }
        .details-box h3 {
            margin: 0 0 8px; font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 0.6px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px;
        }
        .details-box p { margin: 4px 0; font-size: 13.5px; font-weight: 500; line-height: 1.45; color: #1e293b; }
        .checklist-box {
            background: #f8fafc;
            border: 1.5px dashed #64748b;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }
        .checklist-box h4 {
            margin: 0 0 8px; font-size: 12px; text-transform: uppercase; color: #0f172a; letter-spacing: 0.5px;
        }
        table { width: 100%; border-collapse: collapse; margin-bottom: 22px; }
        th { background: #0f172a; color: #fff; text-align: left; padding: 10px 12px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 11px 12px; border-bottom: 1px solid #e2e8f0; font-size: 13px; vertical-align: top; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .summary-wrap { display: flex; justify-content: flex-end; align-items: flex-start; gap: 20px; }
        .summary-table { width: 320px; border-collapse: collapse; }
        .summary-table td { padding: 6px 10px; font-size: 13px; border: none; }
        .summary-table tr.total-row td {
            border-top: 2px solid #0f172a;
            border-bottom: 2px solid #0f172a;
            font-size: 15.5px;
            font-weight: 900;
            padding: 10px;
            color: #0f172a;
        }
        .cod-box {
            margin-top: 22px;
            padding: 14px 18px;
            border: 2px dashed #0f172a;
            border-radius: 10px;
            text-align: center;
            background: #f8fafc;
        }
        .cod-box h2 { margin: 0; font-size: 20px; font-weight: 900; }
        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 11.5px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 14px;
        }
        .badge-status {
            display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: 11px; font-weight: 800; text-transform: uppercase;
            background: #e2e8f0; color: #0f172a;
        }
        .var-tag {
            display: inline-block; font-size: 11px; font-weight: 700; color: #334155;
            background: #f1f5f9; border: 1px solid #cbd5e1; padding: 1px 6px; border-radius: 4px; margin-right: 4px; margin-top: 3px;
        }
        @media print {
            body { padding: 0; background: #fff; }
            .no-print { display: none !important; }
            .invoice-box { border: none; padding: 10px; max-width: 100%; margin: 0; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="print-toolbar no-print" id="printToolbar" style="display:none;">
    <div>
        <div style="font-weight:800;font-size:14px;" id="toolbarTitle">🖨️ Order Invoice Preview</div>
        <div style="font-size:11.5px;color:#94a3b8;" id="toolbarSub">Ready to print or save as PDF</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="toolbar-btn secondary" onclick="togglePrintType()" id="toggleTypeBtn">🔄 Switch Bill / Parcel Slip</button>
        <button class="toolbar-btn" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
</div>

<div id="invoicesRoot">
    <div class="invoice-box" style="text-align:center;padding:60px;color:#64748b;">Loading Invoice...</div>
</div>

<script>
var currentOrderData = null;
var currentPrintType = 'full';

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function togglePrintType() {
    currentPrintType = (currentPrintType === 'bill') ? 'full' : 'bill';
    localStorage.setItem('print_type', currentPrintType);
    renderAllInvoices();
}

function buildSingleInvoiceHtml(o, printType, opts) {
    opts = opts || {};
    var isMaster = opts.mode === 'master';
    var isSubParcel = !!o._isSubParcel || opts.mode === 'brand_sub';
    var storeSettings = o._storeSettings || {};
    var brandInfo = o._brandInfo || {};

    // Determine Store / Brand Header Identity
    var headerName = (!isMaster && brandInfo && brandInfo.name) ? brandInfo.name : (storeSettings.store_name || 'Ranonex');
    var headerLogo = (!isMaster && brandInfo && brandInfo.logo_url) ? brandInfo.logo_url : (storeSettings.logo_url || '');
    var headerPhone = (!isMaster && brandInfo && brandInfo.phone) ? brandInfo.phone : (storeSettings.whatsapp_number || '');
    var headerAddr = (!isMaster && brandInfo && brandInfo.address) ? brandInfo.address : (storeSettings.store_address || '');
    var parentStoreName = storeSettings.store_name || 'Ranonex';

    var bannerHtml = '';
    if (isMaster && Array.isArray(o._subOrderSummaries) && o._subOrderSummaries.length > 1) {
        bannerHtml =
            '<div class="parcel-type-banner master">' +
                '<span>📦 MASTER PARCEL DELIVERY SLIP — Combines ' + o._subOrderSummaries.length + ' Brand Parcels in 1 Outer Courier Bag</span>' +
                '<span>Master Order #' + esc(o.id) + '</span>' +
            '</div>';
    } else if (isSubParcel) {
        bannerHtml =
            '<div class="parcel-type-banner brand-sub">' +
                '<span>🏷️ DEDICATED BRAND PARCEL (' + esc(headerName) + ') — Inner Parcel ' + (o._parcelIndex || 1) + ' of ' + (o._totalParcels || 1) + '</span>' +
                '<span>Pack inside Master Order #' + esc(o._masterOrderId || o.order_group_id || o.id) + '</span>' +
            '</div>';
    }

    var checklistHtml = '';
    if (isMaster && Array.isArray(o._subOrderSummaries) && o._subOrderSummaries.length > 1) {
        var rows = o._subOrderSummaries.map(function(so, idx) {
            var cnt = Array.isArray(so.items) ? so.items.reduce(function(s, i) { return s + (Number(i.quantity) || 1); }, 0) : 0;
            return '<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #cbd5e1;font-size:12.5px;">' +
                '<div><b>[ &nbsp; ] Parcel ' + (idx + 1) + ':</b> 🏷️ <b>' + esc(so.brand_name || 'Brand') + '</b> (Sub-Order <code>#' + esc(so.id) + '</code>)</div>' +
                '<div><b>' + (so.items ? so.items.length : 0) + ' items (Qty: ' + cnt + ')</b> • ৳' + Math.round(so.subtotal || 0) + '</div>' +
            '</div>';
        }).join('');
        checklistHtml =
            '<div class="checklist-box">' +
                '<h4>✅ Master Parcel Packing Checklist (Pack all inner brand parcels below into 1 Master Bag)</h4>' +
                rows +
            '</div>';
    }

    var items = Array.isArray(o.items) ? o.items : [];
    var totalQty = 0;
    var itemsRowsHtml = items.map(function(item, i) {
        var qty = Number(item.quantity) || 1;
        totalQty += qty;
        var price = Number(item.price) || 0;
        var total = price * qty;

        var vTags = [];
        if (isMaster && item.brand_name) {
            vTags.push('<span class="var-tag" style="background:#0f172a;color:#fff;border-color:#0f172a;">🏷️ ' + esc(item.brand_name) + '</span>');
        }
        if (item.color) vTags.push('<span class="var-tag">Color: ' + esc(item.color) + '</span>');
        if (item.size)  vTags.push('<span class="var-tag">Size: ' + esc(item.size) + '</span>');
        if (item.variantCode) vTags.push('<span class="var-tag">Code: ' + esc(item.variantCode) + '</span>');
        if (item.sku)   vTags.push('<span class="var-tag">SKU: ' + esc(item.sku) + '</span>');

        return '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td>' +
                '<div style="font-weight:800;color:#0f172a;font-size:13.5px;">' + esc(item.productName || item.name || 'Product') + '</div>' +
                (vTags.length ? '<div style="margin-top:3px;">' + vTags.join('') + '</div>' : '') +
            '</td>' +
            '<td class="text-center" style="font-weight:900;font-size:14px;">' + qty + '</td>' +
            '<td class="text-right">৳' + price.toLocaleString('en-IN') + '</td>' +
            '<td class="text-right" style="font-weight:800;">৳' + total.toLocaleString('en-IN') + '</td>' +
        '</tr>';
    }).join('');

    var subtotal = Number(o.subtotal || 0);
    var addonTotal = Number(o.addon_total || 0);
    var delivery = Number(o.delivery_charge || 0);
    var discount = Number(o.promo_discount || 0);
    var grandTotal = Number(o.grand_total || 0);
    var advance = Number(o.advance_payable || 0);
    var codDue = (o.payment_status === 'Paid') ? 0 : Math.max(0, grandTotal - advance);

    var summaryRows =
        '<tr><td>Subtotal (' + totalQty + ' qty):</td><td class="text-right">৳' + subtotal.toLocaleString('en-IN') + '</td></tr>' +
        (addonTotal > 0 ? '<tr><td>Add-ons:</td><td class="text-right">৳' + addonTotal.toLocaleString('en-IN') + '</td></tr>' : '') +
        (delivery > 0 || !isSubParcel ? '<tr><td>Delivery Charge:</td><td class="text-right">৳' + delivery.toLocaleString('en-IN') + '</td></tr>' : '<tr><td>Delivery Charge:</td><td class="text-right" style="font-size:11px;color:#64748b;">Included in Master Parcel</td></tr>') +
        (discount > 0 ? '<tr><td>Discount ' + (o.promo_code ? '(' + esc(o.promo_code) + ')' : '') + ':</td><td class="text-right">-৳' + discount.toLocaleString('en-IN') + '</td></tr>' : '') +
        '<tr class="total-row"><td>Grand Total:</td><td class="text-right">৳' + grandTotal.toLocaleString('en-IN') + '</td></tr>' +
        (advance > 0 ? '<tr><td style="color:#16a34a;font-weight:700;">Advance Paid:</td><td class="text-right" style="color:#16a34a;font-weight:700;">-৳' + advance.toLocaleString('en-IN') + '</td></tr>' : '');

    var codHtml = '';
    if (printType === 'full') {
        if (isSubParcel && o._totalParcels > 1) {
            codHtml =
                '<div class="cod-box">' +
                    '<div style="font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;">Inner Brand Parcel (' + esc(headerName) + ') — Parcel Value: ৳' + grandTotal.toLocaleString('en-IN') + '</div>' +
                    '<div style="font-size:12px;color:#64748b;margin-top:4px;">Combine inside Master Order <b>#' + esc(o._masterOrderId || o.order_group_id) + '</b> for courier collection.</div>' +
                '</div>';
        } else if (o.payment_status === 'Paid') {
            codHtml = '<div class="cod-box"><h2 style="color:#16a34a;">✅ FULLY PAID — DO NOT COLLECT CASH (৳0)</h2></div>';
        } else {
            codHtml = '<div class="cod-box"><h2>💰 CASH TO COLLECT (COD): ৳' + codDue.toLocaleString('en-IN') + '</h2></div>';
        }
    }

    var dateStr = o.created_at ? new Date(o.created_at).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

    return '<div class="invoice-box ' + (opts.pageBreak ? 'page-break' : '') + '">' +
        bannerHtml +
        '<div class="header">' +
            '<div class="store-info">' +
                (headerLogo ? '<img src="' + esc(headerLogo) + '" style="max-height:48px;margin-bottom:8px;display:block;object-fit:contain;">' : '') +
                '<h1>' + esc(headerName) + '</h1>' +
                (!isMaster && brandInfo && !brandInfo.is_main && parentStoreName ? '<p style="font-weight:700;color:#0f172a;">An Official Brand of ' + esc(parentStoreName) + '</p>' : '') +
                (headerAddr ? '<p>📍 ' + esc(headerAddr) + '</p>' : '') +
                (headerPhone ? '<p>📞 ' + esc(headerPhone) + '</p>' : '') +
            '</div>' +
            '<div class="invoice-title">' +
                '<h2>' + (printType === 'bill' ? 'BILL INVOICE' : (isMaster ? 'MASTER DELIVERY SLIP' : 'DELIVERY INVOICE')) + '</h2>' +
                '<p>Order ID: #' + esc(o.id) + '</p>' +
                (isSubParcel && o._masterOrderId && o._masterOrderId !== o.id ? '<p style="color:#7e22ce;">Master Order: #' + esc(o._masterOrderId) + '</p>' : '') +
                '<p>Date: ' + esc(dateStr) + '</p>' +
                '<div style="margin-top:6px;"><span class="badge-status">' + esc(o.payment_status || 'Unpaid') + ' (' + esc(o.payment_method || 'COD') + ')</span></div>' +
            '</div>' +
        '</div>' +

        '<div class="details-grid">' +
            '<div class="details-box">' +
                '<h3>📍 Customer & Delivery Address</h3>' +
                '<p style="font-size:15px;font-weight:800;color:#0f172a;">' + esc(o.customer_name || '—') + '</p>' +
                '<p style="font-size:14px;font-weight:800;color:#0f172a;">📞 ' + esc(o.customer_phone || '—') + '</p>' +
                (o.customer_email ? '<p style="font-size:12px;color:#475569;">✉️ ' + esc(o.customer_email) + '</p>' : '') +
                '<p style="margin-top:6px;font-weight:700;background:#fff;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;">' + esc(o.address || '—') + '</p>' +
                '<p style="font-size:12.5px;font-weight:700;color:#334155;margin-top:6px;">' +
                    [o.upazila, o.district, o.division].filter(Boolean).map(esc).join(' • ') +
                '</p>' +
            '</div>' +
            '<div class="details-box">' +
                '<h3>🚚 Order & Shipment Info</h3>' +
                '<p><b>Order Type:</b> ' + (o.order_type === 'pickup' ? '🚶 Store Pickup' : '🚚 Home Delivery') + '</p>' +
                '<p><b>Order Status:</b> ' + esc(o.status || 'Pending') + '</p>' +
                '<p><b>Total Items:</b> ' + items.length + ' items (Qty: ' + totalQty + ')</p>' +
                (o.courier_name ? '<p><b>Courier:</b> ' + esc(o.courier_name) + '</p>' : '') +
                (o.tracking_number ? '<p><b>Tracking #:</b> ' + esc(o.tracking_number) + '</p>' : '') +
                (o.payment_trx_id ? '<p><b>TrxID:</b> ' + esc(o.payment_trx_id) + '</p>' : '') +
            '</div>' +
        '</div>' +

        checklistHtml +

        '<table>' +
            '<thead>' +
                '<tr>' +
                    '<th style="width:36px;">#</th>' +
                    '<th>Item Description & Variant</th>' +
                    '<th class="text-center" style="width:65px;">Qty</th>' +
                    '<th class="text-right" style="width:105px;">Unit Price</th>' +
                    '<th class="text-right" style="width:115px;">Total</th>' +
                '</tr>' +
            '</thead>' +
            '<tbody>' + itemsRowsHtml + '</tbody>' +
        '</table>' +

        '<div class="summary-wrap">' +
            '<div style="flex:1;">' +
                (o.addons && o.addons !== 'None' ? '<div style="padding:10px 12px;background:#fefce8;border:1px solid #fde047;border-radius:8px;font-size:12.5px;"><b>🎁 Add-ons Included:</b> ' + esc(o.addons) + '</div>' : '') +
            '</div>' +
            '<table class="summary-table">' + summaryRows + '</table>' +
        '</div>' +

        codHtml +

        '<div class="footer">' +
            '<p>Thank you for shopping with <b>' + esc(headerName) + '</b>!</p>' +
        '</div>' +
    '</div>';
}

function renderAllInvoices() {
    var root = document.getElementById('invoicesRoot');
    if (!currentOrderData) {
        root.innerHTML = '<div class="invoice-box" style="text-align:center;padding:40px;">No order data found to print.</div>';
        return;
    }

    var toolbar = document.getElementById('printToolbar');
    if (toolbar) toolbar.style.display = 'flex';

    var mode = currentOrderData._invoiceMode || 'brand';
    var htmlParts = [];

    if (mode === 'all_pack' && Array.isArray(currentOrderData._subOrderSummaries) && currentOrderData._subOrderSummaries.length > 0) {
        document.getElementById('toolbarTitle').textContent = '🖨️ Complete Multi-Brand Packing Set (Master Slip + ' + currentOrderData._subOrderSummaries.length + ' Brand Invoices)';
        document.getElementById('toolbarSub').textContent = 'Page 1: Outer Master Parcel Slip • Pages 2-' + (currentOrderData._subOrderSummaries.length + 1) + ': Dedicated Brand Inner Parcel Invoices';

        // Page 1: Master Combined Parcel Slip
        htmlParts.push(buildSingleInvoiceHtml(currentOrderData, currentPrintType, { mode: 'master', pageBreak: false }));

        // Subsequent Pages: Each Brand's Dedicated Inner Parcel Invoice
        currentOrderData._subOrderSummaries.forEach(function(sub) {
            var subWithSettings = Object.assign({}, sub, {
                _isSubParcel: true,
                _storeSettings: currentOrderData._storeSettings || {}
            });
            htmlParts.push(buildSingleInvoiceHtml(subWithSettings, currentPrintType, { mode: 'brand_sub', pageBreak: true }));
        });
    } else if (mode === 'master') {
        document.getElementById('toolbarTitle').textContent = '📦 Master Parcel Invoice — #' + currentOrderData.id;
        document.getElementById('toolbarSub').textContent = 'Combines all brands in this checkout into 1 Master Invoice';
        htmlParts.push(buildSingleInvoiceHtml(currentOrderData, currentPrintType, { mode: 'master', pageBreak: false }));
    } else {
        var bName = (currentOrderData._brandInfo && currentOrderData._brandInfo.name) ? currentOrderData._brandInfo.name : 'Order';
        document.getElementById('toolbarTitle').textContent = '🏷️ Dedicated Invoice (' + bName + ') — #' + currentOrderData.id;
        document.getElementById('toolbarSub').textContent = currentOrderData._isSubParcel
            ? 'Inner Brand Parcel ' + currentOrderData._parcelIndex + ' of ' + currentOrderData._totalParcels + ' (Master Order #' + currentOrderData._masterOrderId + ')'
            : 'Single Brand Invoice';
        htmlParts.push(buildSingleInvoiceHtml(currentOrderData, currentPrintType, { mode: 'brand', pageBreak: false }));
    }

    root.innerHTML = htmlParts.join('');
}

window.onload = function() {
    var orderRaw = localStorage.getItem('print_order');
    currentPrintType = localStorage.getItem('print_type') || 'full';

    if (!orderRaw) {
        document.getElementById('invoicesRoot').innerHTML = '<div class="invoice-box" style="text-align:center;">No order data found to print.</div>';
        return;
    }

    try {
        currentOrderData = JSON.parse(orderRaw);
    } catch(e) {
        document.getElementById('invoicesRoot').innerHTML = '<div class="invoice-box" style="text-align:center;">Invalid order data.</div>';
        return;
    }

    // Fallback to cached public store settings if _storeSettings wasn't embedded
    if (!currentOrderData._storeSettings || !currentOrderData._storeSettings.store_name) {
        try {
            var pubRaw = localStorage.getItem('__fbr_public_data');
            if (pubRaw) {
                var pub = JSON.parse(pubRaw);
                if (pub.data && pub.data.settings) {
                    currentOrderData._storeSettings = pub.data.settings;
                }
            }
        } catch(e){}
    }

    renderAllInvoices();
    setTimeout(function() {
        window.print();
    }, 600);
};
</script>

</body>
</html>
