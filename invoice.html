<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Invoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="assets/js/config.js?v=1794570799956"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #111;
            margin: 0;
            padding: 24px 16px 48px;
            background: #f1f5f9;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .print-toolbar {
            max-width: 820px;
            margin: 0 auto 16px;
            background: #0f172a;
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .toolbar-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar-btn.secondary {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.22);
        }
        .invoice-box {
            max-width: 800px;
            margin: 0 auto 28px;
            border: 1px solid #e2e8f0;
            padding: 36px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .page-break {
            page-break-before: always;
            break-before: page;
        }
        .parcel-type-banner {
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
        }
        .parcel-type-banner.master {
            background: #0f172a;
            color: #fff;
            border: 2px solid #0f172a;
        }
        .parcel-type-banner.brand-sub {
            background: #f3e8ff;
            color: #581c87;
            border: 2px dashed #9333ea;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #0f172a;
            padding-bottom: 10px;
            margin-bottom: 12px;
            gap: 12px;
        }
        .store-info h1 { margin: 0; font-size: 21px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4px; color: #0f172a; line-height: 1.15; }
        .store-info p { margin: 2px 0 0; font-size: 11.5px; color: #475569; line-height: 1.3; }
        .invoice-title { text-align: right; }
        .invoice-title h2 { margin: 0; font-size: 19px; color: #0f172a; font-weight: 900; letter-spacing: 0.4px; line-height: 1.15; }
        .invoice-title p { margin: 2px 0 0; font-size: 11.5px; font-weight: 700; color: #475569; }
        .details-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .details-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 9px 12px;
        }
        .details-box h3 {
            margin: 0 0 5px; font-size: 10.5px; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;
        }
        .details-box p { margin: 2px 0; font-size: 12.5px; font-weight: 500; line-height: 1.35; color: #1e293b; }
        .checklist-box {
            background: #f8fafc;
            border: 1.5px dashed #64748b;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
        }
        .checklist-box h4 {
            margin: 0 0 5px; font-size: 11px; text-transform: uppercase; color: #0f172a; letter-spacing: 0.4px;
        }
        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4px;
        }
        .checklist-grid.cols-2 {
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 12px;
        }
        .checklist-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px dashed #cbd5e1;
            font-size: 11.5px;
            gap: 6px;
        }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        th { background: #0f172a; color: #fff; text-align: left; padding: 7px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
        td { padding: 7px 10px; border-bottom: 1px solid #e2e8f0; font-size: 12.5px; vertical-align: top; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }

        /* Adaptive Multi-Column Items Grid (8+ items -> 2, 3, or 4 columns for single-page fit) */
        .items-grid-header {
            background: #0f172a;
            color: #fff;
            padding: 5px 10px;
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .items-grid {
            display: grid;
            gap: 5px;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-top: none;
            border-radius: 0 0 6px 6px;
            background: #fff;
            margin-bottom: 10px;
        }
        .items-grid.items-grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .items-grid.items-grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 5px; }
        .items-grid.items-grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 4px; }
        .item-card {
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 5px 7px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 2px;
            min-width: 0;
        }
        .item-card-title {
            font-weight: 800;
            color: #0f172a;
            font-size: 11.5px;
            line-height: 1.25;
            word-break: break-word;
        }
        .item-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }
        .item-card-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #334155;
            border-top: 1px dashed #cbd5e1;
            padding-top: 2px;
            margin-top: 1px;
        }
        .items-grid-cols-3 .item-card { padding: 4px 5px; }
        .items-grid-cols-3 .item-card-title { font-size: 10.5px; line-height: 1.2; }
        .items-grid-cols-3 .item-card-foot { font-size: 10px; }
        .items-grid-cols-3 .var-tag { font-size: 9px; padding: 0 4px; margin-top: 1px; }
        .items-grid-cols-4 .item-card { padding: 3px 4px; }
        .items-grid-cols-4 .item-card-title { font-size: 9.5px; line-height: 1.15; }
        .items-grid-cols-4 .item-card-foot { font-size: 9px; }
        .items-grid-cols-4 .var-tag { font-size: 8.5px; padding: 0 3px; margin-top: 1px; }

        /* Progressive Page Density for larger orders */
        .invoice-box.density-3 { padding: 20px; }
        .invoice-box.density-3 .header { padding-bottom: 7px; margin-bottom: 8px; }
        .invoice-box.density-3 .details-grid { gap: 8px; margin-bottom: 8px; }
        .invoice-box.density-3 .details-box { padding: 6px 9px; }
        .invoice-box.density-3 .details-box p { font-size: 11.5px; margin: 1px 0; }
        .invoice-box.density-3 .cod-box { margin-top: 8px; padding: 6px 10px; }
        .invoice-box.density-3 .cod-box h2 { font-size: 16px; }
        .invoice-box.density-3 .footer { margin-top: 8px; padding-top: 6px; }

        .invoice-box.density-4 { padding: 14px; }
        .invoice-box.density-4 .header { padding-bottom: 5px; margin-bottom: 6px; }
        .invoice-box.density-4 .store-info h1 { font-size: 17px; }
        .invoice-box.density-4 .invoice-title h2 { font-size: 15px; }
        .invoice-box.density-4 .details-grid { gap: 6px; margin-bottom: 6px; }
        .invoice-box.density-4 .details-box { padding: 5px 7px; }
        .invoice-box.density-4 .details-box p { font-size: 10.5px; margin: 1px 0; line-height: 1.25; }
        .invoice-box.density-4 .checklist-box { padding: 5px 8px; margin-bottom: 6px; }
        .invoice-box.density-4 .summary-table td { padding: 3px 6px; font-size: 11px; }
        .invoice-box.density-4 .summary-table tr.total-row td { font-size: 13px; padding: 5px 6px; }
        .invoice-box.density-4 .cod-box { margin-top: 6px; padding: 5px 8px; }
        .invoice-box.density-4 .cod-box h2 { font-size: 14px; }
        .invoice-box.density-4 .footer { margin-top: 6px; padding-top: 4px; font-size: 10px; }

        .summary-wrap { display: flex; justify-content: flex-end; align-items: flex-start; gap: 16px; }
        .summary-table { width: 290px; border-collapse: collapse; margin-bottom: 0; }
        .summary-table td { padding: 4px 8px; font-size: 12.5px; border: none; }
        .summary-table tr.total-row td {
            border-top: 2px solid #0f172a;
            border-bottom: 2px solid #0f172a;
            font-size: 14.5px;
            font-weight: 900;
            padding: 7px 8px;
            color: #0f172a;
        }
        .cod-box {
            margin-top: 10px;
            padding: 9px 14px;
            border: 2px dashed #0f172a;
            border-radius: 8px;
            text-align: center;
            background: #f8fafc;
        }
        .cod-box h2 { margin: 0; font-size: 17px; font-weight: 900; }
        .footer {
            margin-top: 12px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
        }
        .badge-status {
            display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10.5px; font-weight: 800; text-transform: uppercase;
            background: #e2e8f0; color: #0f172a;
        }
        .var-tag {
            display: inline-block; font-size: 10.5px; font-weight: 700; color: #334155;
            background: #f1f5f9; border: 1px solid #cbd5e1; padding: 1px 5px; border-radius: 4px; margin-right: 3px; margin-top: 2px;
        }
        @page {
            size: A4;
            margin: 6mm;
        }
        @media print {
            body { padding: 0; background: #fff; margin: 0; }
            .no-print { display: none !important; }
            .invoice-box {
                border: none;
                padding: 2mm 3mm !important;
                max-width: 100%;
                margin: 0;
                box-shadow: none;
                border-radius: 0;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .invoice-box.page-break {
                page-break-before: always;
                break-before: page;
            }
        }
    </style>
</head>
<body>

<div class="print-toolbar no-print" id="printToolbar" style="display:none;">
    <div>
        <div style="font-weight:800;font-size:14px;" id="toolbarTitle">🖨️ Order Invoice Preview</div>
        <div style="font-size:11.5px;color:#94a3b8;" id="toolbarSub">Ready to print or save as PDF</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="toolbar-btn secondary" onclick="togglePrintType()" id="toggleTypeBtn">🔄 Switch Bill / Parcel Slip</button>
        <button class="toolbar-btn" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
</div>

<div id="invoicesRoot">
    <div class="invoice-box" style="text-align:center;padding:60px;color:#64748b;">Loading Invoice...</div>
</div>

<script>
var currentOrderData = null;
var currentPrintType = 'full';

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function togglePrintType() {
    currentPrintType = (currentPrintType === 'bill') ? 'full' : 'bill';
    localStorage.setItem('print_type', currentPrintType);
    renderAllInvoices();
}

function formatMainShopName(rawName) {
    var n = String(rawName || '').trim();
    if (!n || /^r[ae]nonex$/i.test(n)) return 'Ranonex Shop';
    if (/\b(shop|store)\b/i.test(n)) return n;
    return n + ' Shop';
}

function getAdaptiveCols(itemCount) {
    if (itemCount >= 28) return 4;
    if (itemCount >= 17) return 3;
    if (itemCount >= 8) return 2;
    return 1;
}

function buildSingleInvoiceHtml(o, printType, opts) {
    opts = opts || {};
    var isMaster = opts.mode === 'master';
    var isSubParcel = !!o._isSubParcel || opts.mode === 'brand_sub';
    var storeSettings = o._storeSettings || {};
    var brandInfo = o._brandInfo || {};

    // Determine Parent Brand ("Ranonex"), Main Shop ("Ranonex Shop"), or Combined Neutral Identity
    var rawParentName = (storeSettings.main_store_name || storeSettings.store_name || (window.CONFIG && CONFIG.STORE_NAME) || 'Ranonex').trim();
    var parentBrandName = /^r[ae]nonex(\s+(shop|store))?$/i.test(rawParentName)
        ? 'Ranonex'
        : (rawParentName.replace(/\s+(shop|store)$/i, '').trim() || 'Ranonex');
    var mainShopName = formatMainShopName(rawParentName);
    var hasCustomBrand = (!isMaster && brandInfo && !brandInfo.is_main && brandInfo.name && !/^brand_\d+$/i.test(String(brandInfo.name).trim()));

    var headerName = '';
    var headerSub = '';
    var headerLogo = '';
    var showLogo = false;
    var headerPhone = '';
    var headerAddr = '';

    if (isMaster) {
        // Outer combined slip stays completely brand-neutral (no logo, no single-brand / Ranonex branding)
        headerName = (Array.isArray(o._subOrderSummaries) && o._subOrderSummaries.length > 1) ? 'MULTI-BRAND PARCEL' : 'COMBINED PARCEL';
        headerSub = 'Unified Courier Dispatch Summary';
    } else {
        headerName = hasCustomBrand ? String(brandInfo.name).trim() : mainShopName;
        headerSub = 'Official Brand of ' + parentBrandName;
        headerLogo = (hasCustomBrand && brandInfo.logo_url) ? brandInfo.logo_url : (storeSettings.logo_url || storeSettings.main_logo_url || '');
        showLogo = !!headerLogo;
        headerPhone = (hasCustomBrand && brandInfo.phone) ? brandInfo.phone : (storeSettings.whatsapp_number || '');
        headerAddr = (hasCustomBrand && brandInfo.address) ? brandInfo.address : (storeSettings.store_address || '');
    }

    var checklistHtml = '';
    if (isMaster && Array.isArray(o._subOrderSummaries) && o._subOrderSummaries.length > 1) {
        var useTwoColChecklist = o._subOrderSummaries.length > 2;
        var rows = o._subOrderSummaries.map(function(so, idx) {
            var cnt = Array.isArray(so.items) ? so.items.reduce(function(s, i) { return s + (Number(i.quantity) || 1); }, 0) : 0;
            var bDisplay = (so.brand_id || (so._brandInfo && !so._brandInfo.is_main)) ? (so.brand_name || 'Brand') : formatMainShopName(so.brand_name || mainShopName);
            return '<div class="checklist-row">' +
                '<div><b>[ &nbsp; ] Parcel ' + (idx + 1) + ':</b> 🏷️ <b>' + esc(bDisplay) + '</b> (<code>#' + esc(so.id) + '</code>)</div>' +
                '<div style="white-space:nowrap;"><b>' + (so.items ? so.items.length : 0) + ' items (Qty: ' + cnt + ')</b> • ৳' + Math.round(so.subtotal || 0) + '</div>' +
            '</div>';
        }).join('');
        checklistHtml =
            '<div class="checklist-box">' +
                '<h4>✅ Included Parcels Checklist (Pack all parcels below together)</h4>' +
                '<div class="checklist-grid ' + (useTwoColChecklist ? 'cols-2' : '') + '">' + rows + '</div>' +
            '</div>';
    }

    var items = Array.isArray(o.items) ? o.items : [];
    var cols = getAdaptiveCols(items.length);
    var totalQty = 0;

    function buildItemTags(item) {
        var vTags = [];
        if (isMaster && item.brand_name) {
            var tagBrand = item.brand_id ? item.brand_name : formatMainShopName(item.brand_name);
            vTags.push('<span class="var-tag" style="background:#0f172a;color:#fff;border-color:#0f172a;">🏷️ ' + esc(tagBrand) + '</span>');
        }
        if (item.color) vTags.push('<span class="var-tag">Color: ' + esc(item.color) + '</span>');
        if (item.size)  vTags.push('<span class="var-tag">Size: ' + esc(item.size) + '</span>');
        if (item.variantCode) vTags.push('<span class="var-tag">Code: ' + esc(item.variantCode) + '</span>');
        if (item.sku)   vTags.push('<span class="var-tag">SKU: ' + esc(item.sku) + '</span>');
        return vTags;
    }

    var itemsSectionHtml = '';
    if (cols === 1) {
        var itemsRowsHtml = items.map(function(item, i) {
            var qty = Number(item.quantity) || 1;
            totalQty += qty;
            var price = Number(item.price) || 0;
            var total = price * qty;
            var vTags = buildItemTags(item);

            return '<tr>' +
                '<td>' + (i + 1) + '</td>' +
                '<td>' +
                    '<div style="font-weight:800;color:#0f172a;font-size:13px;">' + esc(item.productName || item.name || 'Product') + '</div>' +
                    (vTags.length ? '<div style="margin-top:2px;">' + vTags.join('') + '</div>' : '') +
                '</td>' +
                '<td class="text-center" style="font-weight:900;font-size:13.5px;">' + qty + '</td>' +
                '<td class="text-right">৳' + price.toLocaleString('en-IN') + '</td>' +
                '<td class="text-right" style="font-weight:800;">৳' + total.toLocaleString('en-IN') + '</td>' +
            '</tr>';
        }).join('');

        itemsSectionHtml =
            '<table>' +
                '<thead>' +
                    '<tr>' +
                        '<th style="width:32px;">#</th>' +
                        '<th>Item Description & Variant</th>' +
                        '<th class="text-center" style="width:55px;">Qty</th>' +
                        '<th class="text-right" style="width:95px;">Unit Price</th>' +
                        '<th class="text-right" style="width:105px;">Total</th>' +
                    '</tr>' +
                '</thead>' +
                '<tbody>' + itemsRowsHtml + '</tbody>' +
            '</table>';
    } else {
        var gridCardsHtml = items.map(function(item, i) {
            var qty = Number(item.quantity) || 1;
            totalQty += qty;
            var price = Number(item.price) || 0;
            var total = price * qty;
            var vTags = buildItemTags(item);

            return '<div class="item-card">' +
                '<div>' +
                    '<div class="item-card-title">' + (i + 1) + '. ' + esc(item.productName || item.name || 'Product') + '</div>' +
                    (vTags.length ? '<div class="item-card-meta">' + vTags.join('') + '</div>' : '') +
                '</div>' +
                '<div class="item-card-foot">' +
                    '<span>Qty: <b>' + qty + '</b> × ৳' + price.toLocaleString('en-IN') + '</span>' +
                    '<b style="color:#0f172a;">৳' + total.toLocaleString('en-IN') + '</b>' +
                '</div>' +
            '</div>';
        }).join('');

        itemsSectionHtml =
            '<div class="items-grid-header">' +
                '<span>Items Summary (' + items.length + ' Products • ' + cols + '-Column Layout)</span>' +
                '<span>Total Qty: ' + totalQty + '</span>' +
            '</div>' +
            '<div class="items-grid items-grid-cols-' + cols + '">' + gridCardsHtml + '</div>';
    }

    var subtotal = Number(o.subtotal || 0);
    var addonTotal = Number(o.addon_total || 0);
    var delivery = Number(o.delivery_charge || 0);
    var discount = Number(o.promo_discount || 0);
    var grandTotal = Number(o.grand_total || 0);
    var advance = Number(o.advance_payable || 0);
    var codDue = (o.payment_status === 'Paid') ? 0 : Math.max(0, grandTotal - advance);

    var summaryRows =
        '<tr><td>Subtotal (' + totalQty + ' qty):</td><td class="text-right">৳' + subtotal.toLocaleString('en-IN') + '</td></tr>' +
        (addonTotal > 0 ? '<tr><td>Add-ons:</td><td class="text-right">৳' + addonTotal.toLocaleString('en-IN') + '</td></tr>' : '') +
        (delivery > 0 || !isSubParcel ? '<tr><td>Delivery Charge:</td><td class="text-right">৳' + delivery.toLocaleString('en-IN') + '</td></tr>' : '<tr><td>Delivery Charge:</td><td class="text-right" style="font-size:11px;color:#64748b;">Combined Shipping</td></tr>') +
        (discount > 0 ? '<tr><td>Discount ' + (o.promo_code ? '(' + esc(o.promo_code) + ')' : '') + ':</td><td class="text-right">-৳' + discount.toLocaleString('en-IN') + '</td></tr>' : '') +
        '<tr class="total-row"><td>Grand Total:</td><td class="text-right">৳' + grandTotal.toLocaleString('en-IN') + '</td></tr>' +
        (advance > 0 ? '<tr><td style="color:#16a34a;font-weight:700;">Advance Paid:</td><td class="text-right" style="color:#16a34a;font-weight:700;">-৳' + advance.toLocaleString('en-IN') + '</td></tr>' : '');

    var codHtml = '';
    if (printType === 'full') {
        if (isSubParcel && o._totalParcels > 1) {
            codHtml =
                '<div class="cod-box">' +
                    '<div style="font-size:11.5px;font-weight:700;color:#475569;text-transform:uppercase;">Inner Brand Parcel (' + esc(headerName) + ') — Parcel Value: ৳' + grandTotal.toLocaleString('en-IN') + '</div>' +
                    '<div style="font-size:11.5px;color:#64748b;margin-top:3px;">Pack inside Combined Order <b>#' + esc(o._masterOrderId || o.order_group_id) + '</b> for courier collection.</div>' +
                '</div>';
        } else if (o.payment_status === 'Paid') {
            codHtml = '<div class="cod-box"><h2 style="color:#16a34a;">✅ FULLY PAID — DO NOT COLLECT CASH (৳0)</h2></div>';
        } else {
            codHtml = '<div class="cod-box"><h2>💰 CASH TO COLLECT (COD): ৳' + codDue.toLocaleString('en-IN') + '</h2></div>';
        }
    }

    var dateStr = o.created_at ? new Date(o.created_at).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    var densityClass = 'density-' + cols;

    return '<div class="invoice-box ' + densityClass + ' ' + (opts.pageBreak ? 'page-break' : '') + '">' +
        '<div class="header">' +
            '<div class="store-info">' +
                '<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">' +
                    (showLogo ? '<img class="invoice-logo" src="' + esc(headerLogo) + '" alt="' + esc(headerName) + '" style="max-height:48px;max-width:135px;display:block;object-fit:contain;border-radius:6px;">' : '') +
                    '<div>' +
                        '<h1>' + esc(headerName) + '</h1>' +
                        (headerSub ? '<p style="font-weight:700;color:#475569;margin-top:2px;">' + esc(headerSub) + '</p>' : '') +
                    '</div>' +
                '</div>' +
                (headerAddr ? '<p>📍 ' + esc(headerAddr) + '</p>' : '') +
                (headerPhone ? '<p>📞 ' + esc(headerPhone) + '</p>' : '') +
            '</div>' +
            '<div class="invoice-title">' +
                '<h2>' + (printType === 'bill' ? 'BILL INVOICE' : (isMaster ? 'DELIVERY SLIP' : 'DELIVERY INVOICE')) + '</h2>' +
                '<p>Order ID: #' + esc(o.id) + '</p>' +
                (isSubParcel && o._masterOrderId && o._masterOrderId !== o.id ? '<p style="color:#7e22ce;">Combined Order: #' + esc(o._masterOrderId) + (o._totalParcels > 1 ? ' (' + (o._parcelIndex || 1) + '/' + o._totalParcels + ')' : '') + '</p>' : '') +
                '<p>Date: ' + esc(dateStr) + '</p>' +
                '<div style="margin-top:4px;"><span class="badge-status">' + esc(o.payment_status || 'Unpaid') + ' (' + esc(o.payment_method || 'COD') + ')</span></div>' +
            '</div>' +
        '</div>' +

        '<div class="details-grid">' +
            '<div class="details-box">' +
                '<h3>📍 Customer & Delivery Address</h3>' +
                '<p style="font-size:14px;font-weight:800;color:#0f172a;">' + esc(o.customer_name || '—') + '</p>' +
                '<p style="font-size:13px;font-weight:800;color:#0f172a;">📞 ' + esc(o.customer_phone || '—') + '</p>' +
                (o.customer_email ? '<p style="font-size:11.5px;color:#475569;">✉️ ' + esc(o.customer_email) + '</p>' : '') +
                '<p style="margin-top:4px;font-weight:700;background:#fff;padding:4px 7px;border:1px solid #cbd5e1;border-radius:5px;">' + esc(o.address || '—') + '</p>' +
                '<p style="font-size:11.5px;font-weight:700;color:#334155;margin-top:4px;">' +
                    [o.upazila, o.district, o.division].filter(Boolean).map(esc).join(' • ') +
                '</p>' +
            '</div>' +
            '<div class="details-box">' +
                '<h3>🚚 Order & Shipment Info</h3>' +
                '<p><b>Order Type:</b> ' + (o.order_type === 'pickup' ? '🚶 Store Pickup' : '🚚 Home Delivery') + '</p>' +
                '<p><b>Order Status:</b> ' + esc(o.status || 'Pending') + '</p>' +
                '<p><b>Total Items:</b> ' + items.length + ' items (Qty: ' + totalQty + ')</p>' +
                (o.courier_name ? '<p><b>Courier:</b> ' + esc(o.courier_name) + '</p>' : '') +
                (o.tracking_number ? '<p><b>Tracking #:</b> ' + esc(o.tracking_number) + '</p>' : '') +
                (o.payment_trx_id ? '<p><b>TrxID:</b> ' + esc(o.payment_trx_id) + '</p>' : '') +
            '</div>' +
        '</div>' +

        checklistHtml +

        itemsSectionHtml +

        '<div class="summary-wrap">' +
            '<div style="flex:1;">' +
                (o.addons && o.addons !== 'None' ? '<div style="padding:7px 10px;background:#fefce8;border:1px solid #fde047;border-radius:6px;font-size:11.5px;"><b>🎁 Add-ons Included:</b> ' + esc(o.addons) + '</div>' : '') +
            '</div>' +
            '<table class="summary-table">' + summaryRows + '</table>' +
        '</div>' +

        codHtml +

        '<div class="footer">' +
            (isMaster
                ? '<p style="margin:0;">Thank you for your order! All brand parcels are combined into this shipment.</p>'
                : '<p style="margin:0;">Thank you for shopping with <b>' + esc(headerName) + '</b>!</p>') +
        '</div>' +
    '</div>';
}

function renderAllInvoices() {
    var root = document.getElementById('invoicesRoot');
    if (!currentOrderData) {
        root.innerHTML = '<div class="invoice-box" style="text-align:center;padding:40px;">No order data found to print.</div>';
        return;
    }

    var toolbar = document.getElementById('printToolbar');
    if (toolbar) toolbar.style.display = 'flex';

    var mode = currentOrderData._invoiceMode || 'brand';
    var htmlParts = [];

    if (mode === 'all_pack' && Array.isArray(currentOrderData._subOrderSummaries) && currentOrderData._subOrderSummaries.length > 0) {
        document.getElementById('toolbarTitle').textContent = '🖨️ Complete Multi-Brand Packing Set (Combined Slip + ' + currentOrderData._subOrderSummaries.length + ' Brand Invoices)';
        document.getElementById('toolbarSub').textContent = 'Page 1: Outer Combined Delivery Slip • Pages 2-' + (currentOrderData._subOrderSummaries.length + 1) + ': Dedicated Brand Inner Parcel Invoices';

        // Page 1: Outer Combined Delivery Slip
        htmlParts.push(buildSingleInvoiceHtml(currentOrderData, currentPrintType, { mode: 'master', pageBreak: false }));

        // Subsequent Pages: Each Brand's Dedicated Inner Parcel Invoice
        currentOrderData._subOrderSummaries.forEach(function(sub) {
            var subWithSettings = Object.assign({}, sub, {
                _isSubParcel: true,
                _storeSettings: currentOrderData._storeSettings || {}
            });
            htmlParts.push(buildSingleInvoiceHtml(subWithSettings, currentPrintType, { mode: 'brand_sub', pageBreak: true }));
        });
    } else if (mode === 'master') {
        document.getElementById('toolbarTitle').textContent = '📦 Combined Delivery Slip — #' + currentOrderData.id;
        document.getElementById('toolbarSub').textContent = 'Combines all brands in this checkout into 1 Delivery Slip';
        htmlParts.push(buildSingleInvoiceHtml(currentOrderData, currentPrintType, { mode: 'master', pageBreak: false }));
    } else {
        var bName = (currentOrderData._brandInfo && currentOrderData._brandInfo.name) ? currentOrderData._brandInfo.name : 'Order';
        document.getElementById('toolbarTitle').textContent = '🏷️ Dedicated Invoice (' + bName + ') — #' + currentOrderData.id;
        document.getElementById('toolbarSub').textContent = currentOrderData._isSubParcel
            ? 'Inner Brand Parcel ' + currentOrderData._parcelIndex + ' of ' + currentOrderData._totalParcels + ' (Combined Order #' + currentOrderData._masterOrderId + ')'
            : 'Single Brand Invoice';
        htmlParts.push(buildSingleInvoiceHtml(currentOrderData, currentPrintType, { mode: 'brand', pageBreak: false }));
    }

    root.innerHTML = htmlParts.join('');
}

function isRawBrandIdString(val) {
    if (!val) return true;
    return /^brand_\d+$/i.test(String(val).trim());
}

function hydrateInvoiceData(o, brandsMap, globalSettings) {
    if (!o || typeof o !== 'object') return;
    brandsMap = brandsMap || {};
    var gs = Object.assign({}, o._storeSettings || {}, globalSettings || {});
    if (gs.main_store_name && !gs.store_name) {
        gs.store_name = gs.main_store_name;
    }
    if (!gs.logo_url && o._storeSettings && o._storeSettings.logo_url) {
        gs.logo_url = o._storeSettings.logo_url;
    }
    o._storeSettings = gs;

    var parentName = (gs.store_name || gs.main_store_name || (window.CONFIG && CONFIG.STORE_NAME) || 'Ranonex Shop').trim();
    var mainShopLabel = formatMainShopName(parentName);

    function resolveBrandForOrder(ord) {
        var bId = ord.brand_id || (ord._brandInfo && ord._brandInfo.id) || null;
        if (!bId && Array.isArray(ord.items) && ord.items.length > 0) {
            var firstItemBrand = ord.items[0].brand_id || null;
            var allSame = ord.items.every(function(it) { return (it.brand_id || null) === firstItemBrand; });
            if (allSame && firstItemBrand) bId = firstItemBrand;
        }

        if (bId && brandsMap[bId]) {
            var b = brandsMap[bId];
            var ov = {};
            var sl = {};
            try { ov = typeof b.settings_override === 'string' ? JSON.parse(b.settings_override || '{}') : (b.settings_override || {}); } catch(e){}
            try { sl = typeof b.social_links === 'string' ? JSON.parse(b.social_links || '{}') : (b.social_links || {}); } catch(e){}
            return {
                id: b.id,
                name: b.name,
                slug: b.slug || '',
                logo_url: b.logo_url || gs.logo_url || '',
                phone: (ov && ov.whatsapp_number) || (sl && (sl.whatsapp || sl.phone)) || gs.whatsapp_number || '',
                address: (sl && sl.address) || gs.store_address || '',
                is_main: false
            };
        }

        // Check existing _brandInfo or ord.brand_name or item.brand_name (as long as it is not a raw brand_179... ID)
        var candidateName = '';
        if (ord._brandInfo && ord._brandInfo.name && !isRawBrandIdString(ord._brandInfo.name) && !ord._brandInfo.is_main) {
            candidateName = ord._brandInfo.name;
        } else if (ord.brand_name && !isRawBrandIdString(ord.brand_name) && ord.brand_name !== 'Main Store') {
            candidateName = ord.brand_name;
        } else if (bId && Array.isArray(ord.items) && ord.items[0]) {
            var itName = ord.items[0]._brandLabel || ord.items[0].brand_name || '';
            if (itName && !isRawBrandIdString(itName) && itName !== 'Main Store') {
                candidateName = itName;
            }
        }

        if (candidateName && bId) {
            return {
                id: bId,
                name: candidateName,
                slug: (ord._brandInfo && ord._brandInfo.slug) || '',
                logo_url: (ord._brandInfo && ord._brandInfo.logo_url) || gs.logo_url || '',
                phone: (ord._brandInfo && ord._brandInfo.phone) || gs.whatsapp_number || '',
                address: (ord._brandInfo && ord._brandInfo.address) || gs.store_address || '',
                is_main: false
            };
        }

        return {
            id: null,
            name: mainShopLabel,
            slug: '',
            logo_url: gs.logo_url || '',
            phone: gs.whatsapp_number || '',
            address: gs.store_address || '',
            is_main: true
        };
    }

    function cleanItemsArray(items, fallbackBrandInfo) {
        if (!Array.isArray(items)) return [];
        return items.map(function(it) {
            if (!it || typeof it !== 'object') return it;
            var ibId = it.brand_id || null;
            var resolvedName = '';
            if (ibId && brandsMap[ibId]) {
                resolvedName = brandsMap[ibId].name;
            } else if (it.brand_name && !isRawBrandIdString(it.brand_name)) {
                resolvedName = it.brand_name;
            } else if (it._brandLabel && !isRawBrandIdString(it._brandLabel)) {
                resolvedName = it._brandLabel;
            } else if (fallbackBrandInfo && fallbackBrandInfo.name) {
                resolvedName = fallbackBrandInfo.name;
            }
            return Object.assign({}, it, {
                brand_name: resolvedName || mainShopLabel
            });
        });
    }

    // Check if customer order came from success.html (_subOrders) or track.html (_groupOrders) with multiple brands
    var rawSubs = o._subOrderSummaries || o._subOrders || o._groupOrders || null;
    if (Array.isArray(rawSubs) && rawSubs.length > 1 && !o._invoiceMode) {
        o._invoiceMode = 'master';
        o._subOrderSummaries = rawSubs.map(function(so) {
            var sbInfo = resolveBrandForOrder(so);
            return Object.assign({}, so, {
                _brandInfo: sbInfo,
                brand_name: sbInfo.name,
                items: cleanItemsArray(so.items, sbInfo)
            });
        });
    } else if (Array.isArray(o._subOrderSummaries) && o._subOrderSummaries.length > 0) {
        o._subOrderSummaries = o._subOrderSummaries.map(function(so) {
            var sbInfo = resolveBrandForOrder(so);
            return Object.assign({}, so, {
                _brandInfo: sbInfo,
                brand_name: sbInfo.name,
                items: cleanItemsArray(so.items, sbInfo)
            });
        });
    }

    o._brandInfo = resolveBrandForOrder(o);
    o.items = cleanItemsArray(o.items, o._brandInfo);
}

window.onload = function() {
    var orderRaw = localStorage.getItem('print_order');
    currentPrintType = localStorage.getItem('print_type') || 'full';

    if (!orderRaw) {
        document.getElementById('invoicesRoot').innerHTML = '<div class="invoice-box" style="text-align:center;">No order data found to print.</div>';
        return;
    }

    try {
        currentOrderData = JSON.parse(orderRaw);
    } catch(e) {
        document.getElementById('invoicesRoot').innerHTML = '<div class="invoice-box" style="text-align:center;">Invalid order data.</div>';
        return;
    }

    var brandsMap = {};
    var cachedSettings = {};

    // 1. Seed from sessionStorage / localStorage caches immediately
    try {
        var bListRaw = sessionStorage.getItem('__fbr_brands_list');
        if (bListRaw) {
            JSON.parse(bListRaw).forEach(function(b) { if (b && b.id) brandsMap[b.id] = b; });
        }
    } catch(e){}
    function mergePublicPayload(pubData) {
        if (!pubData) return;
        var baseSettings = Object.assign({}, pubData.settings || {});
        if (pubData.main_settings) {
            if (pubData.main_settings.store_name && !baseSettings.store_name) baseSettings.store_name = pubData.main_settings.store_name;
            if (pubData.main_settings.store_name) baseSettings.main_store_name = pubData.main_settings.store_name;
            if (pubData.main_settings.logo_url && !baseSettings.logo_url) baseSettings.logo_url = pubData.main_settings.logo_url;
            if (pubData.main_settings.logo_url) baseSettings.main_logo_url = pubData.main_settings.logo_url;
        }
        cachedSettings = Object.assign({}, cachedSettings, baseSettings);
        if (Array.isArray(pubData.brands)) {
            pubData.brands.forEach(function(b) { if (b && b.id) brandsMap[b.id] = b; });
        }
    }

    try {
        var pubRaw = localStorage.getItem('__fbr_public_data');
        if (pubRaw) {
            var pub = JSON.parse(pubRaw);
            if (pub && pub.data) mergePublicPayload(pub.data);
        }
    } catch(e){}

    // 2. Fetch fresh brands & main store settings from /public-data (works publicly for both Admin & Customers)
    fetch('/public-data')
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d && d.success && d.data) {
            mergePublicPayload(d.data);
        }
    })
    .catch(function() {})
    .finally(function() {
        hydrateInvoiceData(currentOrderData, brandsMap, cachedSettings);
        renderAllInvoices();

        // Wait for logo images to finish loading before auto-printing (up to 1500ms)
        var imgs = Array.prototype.slice.call(document.querySelectorAll('#invoicesRoot img.invoice-logo'));
        var printed = false;
        function triggerPrint() {
            if (printed) return;
            printed = true;
            window.print();
        }
        if (imgs.length === 0) {
            setTimeout(triggerPrint, 350);
            return;
        }
        var pending = imgs.length;
        function onImgDone() {
            pending--;
            if (pending <= 0) setTimeout(triggerPrint, 150);
        }
        imgs.forEach(function(img) {
            if (img.complete) {
                onImgDone();
            } else {
                img.addEventListener('load', onImgDone);
                img.addEventListener('error', onImgDone);
            }
        });
        setTimeout(triggerPrint, 1500);
    });
};
