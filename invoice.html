<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; color: #111; background: #fff; }
        .invoice-box { max-width: 800px; margin: auto; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .logo-wrap img { max-height: 60px; max-width: 150px; }
        .company-details { text-align: right; font-size: 14px; color: #555; }
        .company-details strong { color: #111; font-size: 18px; display: block; margin-bottom: 4px; }
        
        .info-section { display: flex; justify-content: space-between; margin-bottom: 30px; gap: 20px; }
        .info-block { flex: 1; background: #f9f9fa; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.5; color: #333; }
        .info-block h3 { margin-top: 0; margin-bottom: 10px; font-size: 12px; text-transform: uppercase; color: #777; letter-spacing: 1px; }
        .info-block strong { color: #111; }
        
        .order-meta { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px; }
        .order-meta div { text-align: right; }
        
        table { width: 100%; line-height: inherit; text-align: left; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
        table th { background: #111; color: #fff; padding: 12px; font-weight: 600; white-space: nowrap; }
        table td { padding: 12px; border-bottom: 1px solid #eee; }
        table th:last-child, table td:last-child { text-align: right; }
        
        .totals { width: 300px; margin-left: auto; font-size: 14px; }
        .totals-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .totals-row.grand-total { font-weight: 700; font-size: 18px; border-bottom: none; border-top: 2px solid #111; padding-top: 12px; margin-top: 4px; }
        
        .footer { text-align: center; margin-top: 50px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 20px; }
        
        /* Delivery specific */
        .delivery-slip { border: 2px dashed #ccc; padding: 20px; margin-bottom: 40px; page-break-after: always; display: none; }
        .slip-header { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
        .slip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .slip-box { border: 1px solid #000; padding: 15px; border-radius: 8px; }
        .slip-box h3 { margin-top: 0; margin-bottom: 10px; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .slip-footer { margin-top: 20px; text-align: center; font-size: 16px; font-weight: bold; border: 1px solid #000; padding: 10px; border-radius: 8px; }

        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .invoice-box { padding: 0; box-shadow: none; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="no-print" style="text-align:center; padding: 20px; background: #f0f0f0; margin-bottom: 20px;">
    <button onclick="window.print()" style="padding: 10px 20px; background: #111; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;">Print / Save as PDF</button>
    <button onclick="window.close()" style="padding: 10px 20px; background: #ccc; color: #111; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-left: 10px;">Close</button>
</div>

<div class="invoice-box" id="invoiceContainer">
    <!-- Rendered via JS -->
</div>

<script src="assets/js/config.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var orderDataStr = localStorage.getItem('print_order');
        var printType = localStorage.getItem('print_type'); // 'bill' or 'full'
        if (!orderDataStr) {
            document.getElementById('invoiceContainer').innerHTML = '<p>No order data found.</p>';
            return;
        }
        
        var o = JSON.parse(orderDataStr);
        var s = {};
        try {
            var publicData = JSON.parse(localStorage.getItem('__fbr_public_data') || '{}');
            if (publicData && publicData.data && publicData.data.settings) {
                s = publicData.data.settings;
            }
        } catch(e) {}

        var storeName = s.store_name || CONFIG.STORE_NAME || 'Our Store';
        var storeAddress = s.store_address || 'Dhaka, Bangladesh';
        var storePhone = s.contact_phone || s.whatsapp_number || '';
        var storeEmail = s.contact_email || '';
        var logoUrl = s.logo_url || '';

        var html = '';

        // Delivery Slip (Only for 'full' type)
        if (printType === 'full') {
            html += '<div class="delivery-slip" style="display:block;">';
            html += '<div class="slip-header">DELIVERY SLIP</div>';
            html += '<div class="slip-grid">';
            html += '<div class="slip-box">';
            html += '<h3>FROM (SENDER)</h3>';
            html += '<strong>' + storeName + '</strong><br>';
            if (storeAddress) html += storeAddress.replace(/\\n/g, '<br>') + '<br>';
            if (storePhone) html += 'Phone: ' + storePhone + '<br>';
            html += '</div>';
            html += '<div class="slip-box">';
            html += '<h3>TO (RECEIVER)</h3>';
            html += '<strong>' + (o.customer_name || 'N/A') + '</strong><br>';
            if (o.customer_address) html += o.customer_address.replace(/\\n/g, '<br>') + '<br>';
            html += 'Phone: ' + (o.customer_phone || 'N/A') + '<br>';
            html += '</div>';
            html += '</div>';
            html += '<div class="slip-footer">Amount to Collect (COD): ৳' + parseFloat(o.grand_total).toFixed(2) + '</div>';
            html += '</div>';
        }

        // Invoice Header
        html += '<div class="header">';
        html += '<div class="logo-wrap">';
        if (logoUrl) {
            html += '<img src="' + logoUrl + '" alt="Logo">';
        } else {
            html += '<h2>' + storeName + '</h2>';
        }
        html += '</div>';
        html += '<div class="company-details">';
        html += '<strong>' + storeName + '</strong>';
        if (storeAddress) html += storeAddress.replace(/\\n/g, '<br>') + '<br>';
        if (storePhone) html += storePhone + '<br>';
        if (storeEmail) html += storeEmail + '<br>';
        html += '</div>';
        html += '</div>';

        html += '<div class="order-meta">';
        html += '<div><h1 style="margin:0;font-size:28px;color:#111;">INVOICE</h1></div>';
        html += '<div>';
        html += '<strong>Invoice No:</strong> #' + o.id + '<br>';
        html += '<strong>Date:</strong> ' + new Date(o.created_at).toLocaleDateString() + '<br>';
        html += '<strong>Payment:</strong> ' + (o.payment_method || 'Cash on Delivery') + '<br>';
        html += '</div>';
        html += '</div>';

        html += '<div class="info-section">';
        html += '<div class="info-block">';
        html += '<h3>Billed To / Receiver Details</h3>';
        html += '<strong>' + (o.customer_name || 'N/A') + '</strong><br>';
        html += (o.customer_address || '').replace(/\\n/g, '<br>') + '<br>';
        html += 'Phone: ' + (o.customer_phone || 'N/A');
        html += '</div>';
        html += '<div class="info-block">';
        html += '<h3>Order Details</h3>';
        html += 'Order Type: <strong>' + (o.order_type === 'pickup' ? 'Store Pickup' : 'Home Delivery') + '</strong><br>';
        html += 'Status: <strong>' + (o.status || 'Pending').toUpperCase() + '</strong><br>';
        html += 'Payment Status: <strong>' + (o.payment_status || 'Unpaid').toUpperCase() + '</strong>';
        html += '</div>';
        html += '</div>';

        html += '<table>';
        html += '<thead><tr><th>Item Description</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>';
        html += '<tbody>';
        var items = o.items || [];
        items.forEach(function(item) {
            var varText = [];
            if (item.color) varText.push('Color: ' + item.color);
            if (item.size) varText.push('Size: ' + item.size);
            var varStr = varText.length ? ' <span style="color:#777;font-size:12px;">(' + varText.join(', ') + ')</span>' : '';
            var price = parseFloat(item.price || 0);
            var qty = parseInt(item.quantity || 1);
            html += '<tr>';
            html += '<td><strong>' + (item.productName || 'Product') + '</strong>' + varStr + '</td>';
            html += '<td>' + qty + '</td>';
            html += '<td>৳' + price.toFixed(2) + '</td>';
            html += '<td>৳' + (price * qty).toFixed(2) + '</td>';
            html += '</tr>';
        });
        html += '</tbody>';
        html += '</table>';

        html += '<div class="totals">';
        var sub = parseFloat(o.subtotal || o.grand_total - (o.delivery_charge || 0));
        var dc = parseFloat(o.delivery_charge || 0);
        var grand = parseFloat(o.grand_total || 0);
        var discount = parseFloat(o.discount_amount || 0);

        html += '<div class="totals-row"><span>Subtotal:</span><span>৳' + sub.toFixed(2) + '</span></div>';
        if (dc > 0) {
            html += '<div class="totals-row"><span>Delivery Charge:</span><span>৳' + dc.toFixed(2) + '</span></div>';
        }
        if (discount > 0) {
            html += '<div class="totals-row" style="color:green;"><span>Discount:</span><span>- ৳' + discount.toFixed(2) + '</span></div>';
        }
        html += '<div class="totals-row grand-total"><span>Total Amount:</span><span>৳' + grand.toFixed(2) + '</span></div>';
        html += '</div>';

        html += '<div class="footer">';
        html += 'Thank you for your purchase!<br>';
        html += 'If you have any questions about this invoice, please contact us.';
        html += '</div>';

        document.getElementById('invoiceContainer').innerHTML = html;
        
        // Auto print after a short delay to ensure images load
        setTimeout(function() {
            window.print();
        }, 500);
    });
</script>
</body>
</html>
