<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; color: #000; background: #fff; }
        .invoice-box { max-width: 800px; margin: 0 auto; padding: 30px; font-size: 14px; line-height: 20px; }
        
        .no-print { text-align: center; padding: 15px; background: #f0f0f0; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .no-print button { padding: 10px 20px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-print { background: #000; color: #fff; margin-right: 10px; }
        .btn-close { background: #ddd; color: #000; }

        /* Store Header - Center Aligned */
        .store-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 20px; }
        .store-header img { max-height: 80px; max-width: 200px; margin-bottom: 10px; }
        .store-header h1 { margin: 0 0 5px 0; font-size: 26px; font-weight: bold; text-transform: uppercase; }
        .store-header p { margin: 2px 0; color: #333; font-size: 14px; }

        /* Delivery Slip Block */
        .delivery-slip { border: 2px dashed #000; padding: 20px; margin-bottom: 30px; border-radius: 8px; }
        .delivery-slip-title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; text-decoration: underline; }
        
        .address-container { width: 100%; margin-bottom: 20px; }
        .address-box { width: 48%; display: inline-block; vertical-align: top; }
        .address-box h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: #555; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .address-box p { margin: 4px 0; font-size: 15px; }
        .address-box strong { font-size: 16px; }

        .cod-amount { text-align: center; font-size: 18px; font-weight: bold; border: 2px solid #000; padding: 10px; border-radius: 6px; margin-top: 15px; background: #f9f9f9; }

        /* Order Meta Info */
        .order-meta-table { width: 100%; margin-bottom: 25px; }
        .order-meta-table td { padding: 5px 0; }
        .meta-label { font-weight: bold; width: 120px; }

        /* Items Table */
        .items-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .items-table th, .items-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .items-table th { background: #f5f5f5; font-weight: bold; text-transform: uppercase; font-size: 13px; }
        .items-table td.money { text-align: right; }
        .items-table th.money { text-align: right; }

        /* Totals */
        .totals-container { width: 100%; text-align: right; }
        .totals-table { width: 350px; display: inline-table; border-collapse: collapse; }
        .totals-table td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        .totals-table tr:last-child td { border-bottom: none; border-top: 2px solid #000; font-weight: bold; font-size: 18px; padding-top: 12px; }

        .footer-note { text-align: center; margin-top: 40px; font-size: 13px; color: #666; border-top: 1px solid #ddd; padding-top: 15px; }

        @media print {
            .no-print { display: none !important; }
            body, .invoice-box { background: #fff; margin: 0; padding: 10px; width: 100%; max-width: 100%; }
            .delivery-slip { page-break-inside: avoid; margin-bottom: 40px; }
            .store-header { padding-top: 0; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button class="btn-print" onclick="window.print()">Print Invoice</button>
    <button class="btn-close" onclick="window.close()">Close</button>
</div>

<div class="invoice-box" id="invoiceContainer">
    <!-- Rendered via JS -->
</div>

<script src="assets/js/config.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var orderDataStr = localStorage.getItem('print_order');
        var printType = localStorage.getItem('print_type'); // 'bill' or 'full'
        if (!orderDataStr) {
            document.getElementById('invoiceContainer').innerHTML = '<p style="text-align:center;">No order data found.</p>';
            return;
        }
        
        var o = JSON.parse(orderDataStr);
        var s = {};
        try {
            var publicData = JSON.parse(localStorage.getItem('__fbr_public_data') || '{}');
            if (publicData && publicData.data && publicData.data.settings) {
                s = publicData.data.settings;
            }
        } catch(e) {}

        var storeName = s.store_name || CONFIG.STORE_NAME || 'Store Name';
        var storeAddress = s.store_address || '';
        var storePhone = s.contact_phone || s.whatsapp_number || '';
        var storeEmail = s.contact_email || '';
        var logoUrl = s.logo_url || '';

        var html = '';

        // --- STORE HEADER ---
        html += '<div class="store-header">';
        if (logoUrl) {
            html += '<img src="' + logoUrl + '" alt="Store Logo">';
        } else {
            html += '<h1>' + storeName + '</h1>';
        }
        if (storeAddress) html += '<p>' + storeAddress.replace(/\\n/g, ', ') + '</p>';
        if (storePhone) html += '<p>Phone: ' + storePhone + '</p>';
        if (storeEmail) html += '<p>Email: ' + storeEmail + '</p>';
        html += '</div>';

        // --- DELIVERY SLIP (Only for 'full' type) ---
        if (printType === 'full') {
            html += '<div class="delivery-slip">';
            html += '<div class="delivery-slip-title">Delivery Slip</div>';
            
            html += '<div class="address-container">';
            // SENDER INFO
            html += '<div class="address-box">';
            html += '<h3>Sender (From):</h3>';
            html += '<p><strong>' + storeName + '</strong></p>';
            if (storePhone) html += '<p>Phone: ' + storePhone + '</p>';
            html += '</div>';

            // RECEIVER INFO
            html += '<div class="address-box" style="float: right;">';
            html += '<h3>Receiver (To):</h3>';
            html += '<p><strong>' + (o.customer_name || 'N/A') + '</strong></p>';
            html += '<p>Phone: ' + (o.customer_phone || 'N/A') + '</p>';
            var customerAddr = o.address || o.customer_address || '';
            if (customerAddr) html += '<p>' + customerAddr.replace(/\\n/g, '<br>') + '</p>';
            html += '</div>';
            html += '<div style="clear:both;"></div>'; // clear floats
            html += '</div>'; // end address-container

            var grandTotal = parseFloat(o.grand_total || 0);
            var advanceAmt = parseFloat(o.advance_payable || 0);
            var codAmount = (grandTotal - advanceAmt).toFixed(2);
            
            if (o.payment_method === 'COD' && (o.payment_status || '').toLowerCase() !== 'paid') {
                var advText = advanceAmt > 0 ? ' <small style="font-weight:normal;color:#555;">(After ৳' + advanceAmt.toFixed(2) + ' Advance)</small>' : '';
                html += '<div class="cod-amount">Amount to Collect (COD): ৳' + codAmount + advText + '</div>';
            } else {
                html += '<div class="cod-amount" style="border-color:#ccc; color:#555;">Payment Status: ' + (o.payment_status || 'Paid').toUpperCase() + ' (' + (o.payment_method || 'Online') + ')</div>';
            }
            html += '</div>'; // end delivery-slip
        }

        // --- INVOICE BILL ---
        html += '<h2 style="text-align:center; margin-bottom: 20px; text-transform:uppercase; letter-spacing: 1px;">Customer Invoice</h2>';

        // Order Meta Data
        html += '<table class="order-meta-table">';
        html += '<tr>';
        html += '<td style="vertical-align:top; width: 50%;">';
        html += '<table style="width:100%;">';
        html += '<tr><td class="meta-label">Invoice No:</td><td>#' + o.id + '</td></tr>';
        html += '<tr><td class="meta-label">Date:</td><td>' + new Date(o.created_at).toLocaleDateString() + '</td></tr>';
        html += '<tr><td class="meta-label">Order Type:</td><td>' + (o.order_type === 'pickup' ? 'Store Pickup' : 'Home Delivery') + '</td></tr>';
        html += '</table>';
        html += '</td>';
        html += '<td style="vertical-align:top; width: 50%;">';
        html += '<table style="width:100%;">';
        html += '<tr><td class="meta-label">Customer:</td><td>' + (o.customer_name || 'N/A') + '</td></tr>';
        html += '<tr><td class="meta-label">Phone:</td><td>' + (o.customer_phone || 'N/A') + '</td></tr>';
        var customerAddr = o.address || o.customer_address || '';
        if (customerAddr) {
            html += '<tr><td class="meta-label">Address:</td><td>' + customerAddr.replace(/\\n/g, ', ') + '</td></tr>';
        }
        html += '<tr><td class="meta-label">Payment:</td><td>' + (o.payment_method || 'COD') + ' (' + (o.payment_status || 'Unpaid') + ')</td></tr>';
        html += '</table>';
        html += '</td>';
        html += '</tr>';
        html += '</table>';

        // Items Table
        html += '<table class="items-table">';
        html += '<thead><tr><th>Item Description</th><th style="width:60px;text-align:center;">Qty</th><th class="money" style="width:100px;">Unit Price</th><th class="money" style="width:100px;">Total</th></tr></thead>';
        html += '<tbody>';
        var items = o.items || [];
        if(items.length === 0) {
             html += '<tr><td colspan="4" style="text-align:center;">No items found</td></tr>';
        } else {
            items.forEach(function(item) {
                var varText = [];
                if (item.color) varText.push('Color: ' + item.color);
                if (item.size) varText.push('Size: ' + item.size);
                var varStr = varText.length ? ' <br><small style="color:#666;">(' + varText.join(', ') + ')</small>' : '';
                var price = parseFloat(item.price || 0);
                var qty = parseInt(item.quantity || 1);
                html += '<tr>';
                html += '<td><strong>' + (item.productName || 'Product') + '</strong>' + varStr + '</td>';
                html += '<td style="text-align:center;">' + qty + '</td>';
                html += '<td class="money">৳' + price.toFixed(2) + '</td>';
                html += '<td class="money">৳' + (price * qty).toFixed(2) + '</td>';
                html += '</tr>';
            });
        }
        html += '</tbody>';
        html += '</table>';

        // Totals
        var sub = parseFloat(o.subtotal || o.grand_total - (o.delivery_charge || 0));
        var dc = parseFloat(o.delivery_charge || 0);
        var grand = parseFloat(o.grand_total || 0);
        var discount = parseFloat(o.discount_amount || 0);
        var advanceAmt = parseFloat(o.advance_payable || 0);

        html += '<div class="totals-container">';
        html += '<table class="totals-table">';
        html += '<tr><td>Subtotal:</td><td style="text-align:right;">৳' + sub.toFixed(2) + '</td></tr>';
        if (dc > 0) {
            html += '<tr><td>Delivery Charge:</td><td style="text-align:right;">৳' + dc.toFixed(2) + '</td></tr>';
        }
        if (discount > 0) {
            html += '<tr><td style="color:green;">Discount:</td><td style="text-align:right;color:green;">- ৳' + discount.toFixed(2) + '</td></tr>';
        }
        html += '<tr style="border-top: 2px solid #000; font-weight: bold;"><td>Total Amount:</td><td style="text-align:right;">৳' + grand.toFixed(2) + '</td></tr>';
        
        if (advanceAmt > 0) {
            html += '<tr><td>Advance Paid:</td><td style="text-align:right; color:green;">- ৳' + advanceAmt.toFixed(2) + '</td></tr>';
            html += '<tr style="font-size:16px;"><td>Due Amount (COD):</td><td style="text-align:right; font-weight:bold; font-size:18px;">৳' + (grand - advanceAmt).toFixed(2) + '</td></tr>';
        }
        html += '</table>';
        html += '</div>';

        // Footer Note
        html += '<div class="footer-note">';
        html += '<strong>Thank you for shopping with us!</strong><br>';
        html += 'If you have any questions about this invoice, please contact our support.';
        html += '</div>';

        document.getElementById('invoiceContainer').innerHTML = html;
        
        // Removed auto print to let the user see the layout first and prevent blank screen issues in Chrome
    });
</script>
</body>
</html>
