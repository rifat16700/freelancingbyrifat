    <script>
      (function () {
        var mode = "light";
        try { mode = localStorage.getItem("fbr_admin_theme") === "dark" ? "dark" : "light"; } catch (e) {}
        document.documentElement.setAttribute("data-admin-theme", mode);
        if (mode === "dark") document.documentElement.classList.add("dark");
        if (typeof CONFIG !== "undefined" && CONFIG.BRAND_COLORS) {
          try {
            var bc = typeof CONFIG.BRAND_COLORS === "object" ? CONFIG.BRAND_COLORS : JSON.parse(String(CONFIG.BRAND_COLORS).trim());
            if (bc && typeof bc === "object") {
              var s = document.documentElement.style;
              if (bc.primary) s.setProperty("--primary", bc.primary);
              if (bc.primary_light) s.setProperty("--primary-light", bc.primary_light);
              if (bc.primary_dark || bc.primaryDark) s.setProperty("--primary-dark", bc.primary_dark || bc.primaryDark);
            }
          } catch (e) {}
        }
      })();
    </script>
