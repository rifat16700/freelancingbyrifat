<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Check - BD Courier</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

    <div class="max-w-4xl mx-auto p-4 md:p-6 mt-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2"><i class="fa-solid fa-shield-halved text-blue-600"></i> Customer Fraud Check</h1>
            <p class="text-gray-500">Check customer parcel history across multiple couriers (BD Courier API)</p>
        </div>

        <!-- Search Box -->
        <div class="glass-card p-6 mb-8">
            <form id="checkForm" class="flex flex-col md:flex-row gap-4">
                <input type="text" id="phoneInput" placeholder="Enter Phone Number (e.g. 017xxxxxxxx)" required pattern="[0-9]{11}" 
                       class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg">
                <button type="submit" id="checkBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition duration-200">
                    <span id="btnText"><i class="fa-solid fa-magnifying-glass mr-2"></i> Check Record</span>
                    <span id="btnLoader" class="hidden"><div class="loader mr-2"></div> Checking...</span>
                </button>
            </form>
            <div id="errorMsg" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm font-semibold"></div>
        </div>

        <!-- Results Section (Hidden initially) -->
        <div id="resultsSection" class="hidden space-y-6">
            
            <!-- Summary Card -->
            <div class="glass-card p-6 bg-gradient-to-r from-blue-50 to-indigo-50 border-l-4 border-blue-600">
                <h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fa-solid fa-chart-pie text-blue-600 mr-2"></i> Overall Summary</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">Total Parcels</div>
                        <div class="text-2xl font-bold text-gray-800" id="sumTotal">0</div>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">Success</div>
                        <div class="text-2xl font-bold text-green-600" id="sumSuccess">0</div>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">Cancelled</div>
                        <div class="text-2xl font-bold text-red-600" id="sumCancelled">0</div>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">Success Ratio</div>
                        <div class="text-2xl font-bold text-blue-600" id="sumRatio">0%</div>
                    </div>
                </div>
            </div>

            <!-- Courier Details Grid -->
            <div>
                <h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fa-solid fa-truck-fast text-gray-600 mr-2"></i> Courier Breakdown</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="courierGrid">
                    <!-- Courier cards injected here -->
                </div>
            </div>

            <!-- Fraud Reports -->
            <div id="reportsContainer" class="hidden">
                <h2 class="text-xl font-bold text-red-700 mb-4"><i class="fa-solid fa-triangle-exclamation mr-2"></i> Fraud Reports</h2>
                <div class="space-y-3" id="reportsList">
                    <!-- Reports injected here -->
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_KEY = 'eRxFVeMmB8fY8zu670PAjf9rgEfY6SuQQVdEIh5XHLnYXcGgDJ6hdc2y7tLS';
        const API_URL = 'https://api.bdcourier.com/courier-check';

        document.getElementById('checkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = document.getElementById('phoneInput').value.trim();
            if(!phone) return;

            // UI states
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const btn = document.getElementById('checkBtn');
            const errorMsg = document.getElementById('errorMsg');
            const resultsSection = document.getElementById('resultsSection');

            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            btn.disabled = true;
            errorMsg.classList.add('hidden');
            resultsSection.classList.add('hidden');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({ phone: phone })
                });

                const resData = await response.json();

                if (resData.status === 'success' && resData.data) {
                    renderData(resData.data);
                    resultsSection.classList.remove('hidden');
                } else {
                    throw new Error(resData.message || 'Failed to fetch data or no record found.');
                }

            } catch (err) {
                errorMsg.textContent = err.message || 'An error occurred while connecting to the API.';
                errorMsg.classList.remove('hidden');
            } finally {
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
                btn.disabled = false;
            }
        });

        function renderData(data) {
            // 1. Render Summary
            if (data.summary) {
                document.getElementById('sumTotal').textContent = data.summary.total_parcel || 0;
                document.getElementById('sumSuccess').textContent = data.summary.success_parcel || 0;
                document.getElementById('sumCancelled').textContent = data.summary.cancelled_parcel || 0;
                document.getElementById('sumRatio').textContent = (data.summary.success_ratio || 0) + '%';
            }

            // 2. Render Couriers
            const grid = document.getElementById('courierGrid');
            grid.innerHTML = '';
            const excludeKeys = ['summary', 'reports'];
            
            for (const key in data) {
                if (excludeKeys.includes(key)) continue;
                
                const c = data[key];
                if (!c || typeof c !== 'object' || c.total_parcel === undefined) continue;
                if (c.total_parcel === 0) continue; // Skip empty ones if desired (or show them, let's show if total > 0)

                let logoHtml = '';
                if(c.logo) {
                    logoHtml = `<img src="${c.logo}" alt="${c.name}" class="h-6 object-contain">`;
                } else {
                    logoHtml = `<span class="font-bold text-gray-700">${c.name}</span>`;
                }

                let ratioColor = 'text-green-600';
                if(c.success_ratio < 60) ratioColor = 'text-red-600';
                else if(c.success_ratio < 80) ratioColor = 'text-yellow-600';

                grid.innerHTML += `
                    <div class="glass-card p-4 flex flex-col h-full border border-gray-100">
                        <div class="flex justify-between items-center border-b pb-2 mb-3">
                            ${logoHtml}
                            <span class="text-xs font-bold bg-gray-100 px-2 py-1 rounded text-gray-600">${c.name}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-sm flex-grow">
                            <div class="text-gray-500">Total:</div>
                            <div class="font-bold text-right">${c.total_parcel}</div>
                            
                            <div class="text-gray-500">Success:</div>
                            <div class="font-bold text-green-600 text-right">${c.success_parcel}</div>
                            
                            <div class="text-gray-500">Cancelled:</div>
                            <div class="font-bold text-red-600 text-right">${c.cancelled_parcel}</div>
                        </div>
                        <div class="mt-3 pt-2 border-t flex justify-between items-center">
                            <span class="text-xs text-gray-500 font-semibold">Success Ratio</span>
                            <span class="font-bold ${ratioColor}">${c.success_ratio}%</span>
                        </div>
                    </div>
                `;
            }

            // 3. Render Reports
            const rList = document.getElementById('reportsList');
            const rContainer = document.getElementById('reportsContainer');
            rList.innerHTML = '';

            if (data.reports && data.reports.length > 0) {
                data.reports.forEach(r => {
                    let dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString() : '';
                    rList.innerHTML += `
                        <div class="glass-card p-4 border-l-4 border-red-500 bg-red-50 flex items-start gap-3">
                            <div class="mt-1 flex-shrink-0">
                                ${r.courierLogo ? `<img src="${r.courierLogo}" class="w-8 h-8 object-contain rounded-full bg-white p-1 shadow-sm">` : `<i class="fa-solid fa-circle-exclamation text-red-500 text-xl"></i>`}
                            </div>
                            <div class="flex-grow">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-gray-900">${r.name || 'Unknown'} <span class="text-xs bg-red-200 text-red-800 px-2 py-0.5 rounded ml-2">${r.courierName || 'Report'}</span></h3>
                                    <span class="text-xs text-gray-500 font-semibold">${dateStr}</span>
                                </div>
                                <p class="text-sm text-gray-700 mt-1">${r.details || 'No details provided.'}</p>
                            </div>
                        </div>
                    `;
                });
                rContainer.classList.remove('hidden');
            } else {
                rContainer.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
